<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Protected</title><script src="vendor/chart.umd.min.js"></script>
<style>#g{font-family:system-ui,sans-serif;max-width:320px;margin:20vh auto;text-align:center}#g input,#g button{font-size:1rem;padding:8px;margin:4px;width:90%}#e{color:#c62828}</style></head>
<body><form id="g"><h3>Passcode</h3><input id="pw" type="password" autocomplete="current-password" autofocus><button>Open</button><div id="e"></div></form>
<script>
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const p=await (await fetch('payload.enc',{cache:'no-store'})).json();
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(p.salt),iterations:p.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const b=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(p.iv)},key,u(p.ct))));
 const files={'data.json':b.data,'cve_findings.json':b.cve},of=window.fetch;
 window.fetch=(x,o)=>files[x]!==undefined?Promise.resolve(new Response(files[x])):of(x,o);
 document.title='SONiC PR Dashboard';const st=document.createElement('style');st.textContent=b.css;document.head.appendChild(st);
 document.body.innerHTML=b.body;const sc=document.createElement('script');sc.textContent=b.js;document.body.appendChild(sc);}
document.getElementById('g').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;document.getElementById('e').textContent='Checking…';
 try{sessionStorage.setItem('k',pw);await open_(pw)}catch(x){sessionStorage.removeItem('k');document.getElementById('e').textContent='Wrong passcode'}};
if(sessionStorage.k)open_(sessionStorage.k).catch(()=>sessionStorage.removeItem('k'));
</script></body></html>
